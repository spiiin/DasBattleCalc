<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DasBattleCalc</title>
<style>
  html, body { margin: 0; height: 100%; background: #727272; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
  #bar { position: fixed; right: 8px; bottom: 4px; z-index: 2; display: flex; gap: 10px; align-items: center;
    background: #3a3a3a; color: #e6e6e6; padding: 3px 10px; border-radius: 4px; opacity: 0.92; }
  #bar label { cursor: pointer; padding: 1px 8px; border: 1px solid #191919; border-radius: 4px;
    background: linear-gradient(#999, #828282); color: #000; }
  #bar input { display: none; }
  canvas { display: block; outline: none; }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 3;
    color: #e6e6e6; background: #2b2b2b; padding: 12px 22px; border-radius: 6px; white-space: pre-wrap; max-width: 80vw; }
</style>
</head>
<body>
<div id="bar">
  <label>Сейв BizHawk (.State, mGBA / melonDS) или PPSSPP (.ppst)<input id="state" type="file" accept=".State,.state,.ppst"></label>
  <label>ROM FFTA или FFTA2 (USA)<input id="rom" type="file" accept=".gba,.nds,.zip"></label>
  <span id="files">файлы обрабатываются в браузере и никуда не отправляются</span>
</div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Загрузка…</div>
<script src="battlecalc_web.js"></script>
<script src="app.js"></script>
</body>
</html>
